name: RL78

on:
  push:
    branches: [rl78, master]
  pull_request:
    branches: [rl78, master]

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DTARGET_ARCH=rl78 -DTARGET_WORD_SIZE=32

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Fetch guest .abs
        run: python3 tests/rl78/fetch.py

      - name: Run AND1 instruction tests
        run: python3 tests/rl78/run.py --harness ./build/tlib-harness --glob 'and1.abs'

      - name: Run CLR1 instruction tests
        run: python3 tests/rl78/run.py --harness ./build/tlib-harness --glob 'clr1.abs'

      - name: Run MOV instruction tests
        run: python3 tests/rl78/run.py --harness ./build/tlib-harness --glob 'mov_*.abs'

      - name: Run ADD instruction tests
        run: python3 tests/rl78/run.py --harness ./build/tlib-harness --glob 'add.abs'

      - name: Run ADDW instruction tests
        run: python3 tests/rl78/run.py --harness ./build/tlib-harness --glob 'addw.abs'

      - name: Run ADDC instruction tests
        run: python3 tests/rl78/run.py --harness ./build/tlib-harness --glob 'addc.abs'

      - name: Run AND instruction tests
        run: python3 tests/rl78/run.py --harness ./build/tlib-harness --glob 'and.abs'

      - name: Run BR addr16 instruction tests
        run: python3 tests/rl78/run.py --harness ./build/tlib-harness --glob 'br_addr16.abs'

      - name: Run BRANCH instruction tests
        run: python3 tests/rl78/run.py --harness ./build/tlib-harness --glob 'branch.abs'

      - name: Run BRK instruction tests
        run: python3 tests/rl78/run.py --harness ./build/tlib-harness --glob 'brk.abs'

      - name: Run CALL instruction tests
        run: python3 tests/rl78/run.py --harness ./build/tlib-harness --glob 'call.abs'

      - name: Run CALLT instruction tests
        run: python3 tests/rl78/run.py --harness ./build/tlib-harness --glob 'callt.abs'

      - name: Run CLRB instruction tests
        run: python3 tests/rl78/run.py --harness ./build/tlib-harness --glob 'clrb.abs'

      - name: Run CLRW instruction tests
        run: python3 tests/rl78/run.py --harness ./build/tlib-harness --glob 'clrw.abs'

      - name: Run CMP instruction tests
        run: python3 tests/rl78/run.py --harness ./build/tlib-harness --glob 'cmp.abs'

      - name: Run CMPW instruction tests
        run: python3 tests/rl78/run.py --harness ./build/tlib-harness --glob 'cmpw.abs'

      - name: Run CMP A, #imm instruction tests
        run: python3 tests/rl78/run.py --harness ./build/tlib-harness --glob 'cmp_a_i.abs'

      - name: Run INC/DEC instruction tests
        run: python3 tests/rl78/run.py --harness ./build/tlib-harness --glob 'incdec.abs'

      - name: Run MOD/IND DE instruction tests
        run: python3 tests/rl78/run.py --harness ./build/tlib-harness --glob 'mod_ind_de.abs'

      - name: Run MOVW rp instruction tests
        run: python3 tests/rl78/run.py --harness ./build/tlib-harness --glob 'movw_rp_*.abs'

      - name: Run MULU instruction tests
        run: python3 tests/rl78/run.py --harness ./build/tlib-harness --glob 'mulu.abs'

      - name: Run MULH instruction tests
        run: python3 tests/rl78/run.py --harness ./build/tlib-harness --glob 'mulh.abs'

      - name: Run MULHU instruction tests
        run: python3 tests/rl78/run.py --harness ./build/tlib-harness --glob 'mulhu.abs'

      - name: Run DIVHU instruction tests
        run: python3 tests/rl78/run.py --harness ./build/tlib-harness --glob 'divhu.abs'

      - name: Run DIVWU instruction tests
        run: python3 tests/rl78/run.py --harness ./build/tlib-harness --glob 'divwu.abs'

      - name: Run MAC instruction tests
        run: python3 tests/rl78/run.py --harness ./build/tlib-harness --glob 'mac.abs'

      - name: Run PUSH/POP instruction tests
        run: python3 tests/rl78/run.py --harness ./build/tlib-harness --glob 'pushpop.abs'

      - name: Run MOV1 instruction tests
        run: python3 tests/rl78/run.py --harness ./build/tlib-harness --glob 'mov1.abs'

      - name: Run MOVS instruction tests
        run: python3 tests/rl78/run.py --harness ./build/tlib-harness --glob 'movs.abs'

      - name: Run NOT1 instruction tests
        run: python3 tests/rl78/run.py --harness ./build/tlib-harness --glob 'not1.abs'

      - name: Run ONEB instruction tests
        run: python3 tests/rl78/run.py --harness ./build/tlib-harness --glob 'oneb.abs'

      - name: Run ONEW instruction tests
        run: python3 tests/rl78/run.py --harness ./build/tlib-harness --glob 'onew.abs'

      - name: Run OR instruction tests
        run: python3 tests/rl78/run.py --harness ./build/tlib-harness --glob 'or.abs'

      - name: Run OR1 instruction tests
        run: python3 tests/rl78/run.py --harness ./build/tlib-harness --glob 'or1.abs'

      - name: Run RETI instruction tests
        run: python3 tests/rl78/run.py --harness ./build/tlib-harness --glob 'reti.abs'

      - name: Run SEL instruction tests
        run: python3 tests/rl78/run.py --harness ./build/tlib-harness --glob 'sel.abs'

      - name: Run SET1 instruction tests
        run: python3 tests/rl78/run.py --harness ./build/tlib-harness --glob 'set1.abs'

      - name: Run shift instruction tests
        run: python3 tests/rl78/run.py --harness ./build/tlib-harness --glob 'shift.abs'

      - name: Run SKIP instruction tests
        run: python3 tests/rl78/run.py --harness ./build/tlib-harness --glob 'skip.abs'

      - name: Run SUB instruction tests
        run: python3 tests/rl78/run.py --harness ./build/tlib-harness --glob 'sub.abs'

      - name: Run SUBC instruction tests
        run: python3 tests/rl78/run.py --harness ./build/tlib-harness --glob 'subc.abs'

      - name: Run SUBW instruction tests
        run: python3 tests/rl78/run.py --harness ./build/tlib-harness --glob 'subw.abs'

      - name: Run XCH instruction tests
        run: python3 tests/rl78/run.py --harness ./build/tlib-harness --glob 'xch.abs'

      - name: Run XCHW instruction tests
        run: python3 tests/rl78/run.py --harness ./build/tlib-harness --glob 'xchw.abs'

      - name: Run XOR instruction tests
        run: python3 tests/rl78/run.py --harness ./build/tlib-harness --glob 'xor.abs'

      - name: Run XOR1 instruction tests
        run: python3 tests/rl78/run.py --harness ./build/tlib-harness --glob 'xor1.abs'

      - name: Run rotate family tests
        run: python3 tests/rl78/run.py --harness ./build/tlib-harness --glob 'rotate.abs'
